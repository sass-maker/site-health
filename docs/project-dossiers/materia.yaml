product:
  description: Evidence-graded remedy reference organized by body system.
  publicMakerNote: I want to make anatomy explorable and connect body concerns to clear, evidence-based information about treatments and remedies.
  purposeContract:
    purpose: Materia explores an anatomy-led, evidence-graded reference for understanding body concerns, treatments, and remedies.
    audience: People seeking a clearer educational map from a body concern to bounded, source-backed information.
    outcome: Understand relevant anatomy and compare remedy evidence without mistaking the product for medical diagnosis.
    mechanism: An interactive body-system model links concerns to structured remedy pages with explicit evidence grades and safety limits.
    proof: A technically ambitious reference exists, but sustained evidence quality, medical safety, and content maintenance are unresolved.
    nextAction: Use the retained material as an educational experiment only; reopen publication work after defining a medical-safety and evidence standard.
