name: Workflow Policy CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "foundry/ops/scripts/check-github-actions-policy.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "foundry/ops/scripts/check-github-actions-policy.mjs"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm run check:actions
