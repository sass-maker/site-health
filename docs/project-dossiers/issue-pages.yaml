product:
  description: Read public GitHub issues as focused articles; publishing requires repository-owner access.
  publicMakerNote: I wanted publishing a public page to be as simple as opening a GitHub issue.
  purposeContract:
    purpose: IssuePages turns a GitHub issue into a readable, searchable public page.
    audience: A builder or writer who wants lightweight publishing while keeping GitHub as the editing workflow.
    outcome: Publish and update a durable page without adopting a separate CMS.
    mechanism: An owner-approved issue is rendered into a public page with edit, archive, search, and source-link behavior.
    proof: The owner-only production pilot has proven the issue-to-page loop at issues.sarthakagrawal.dev.
    nextAction: Explore the finished experiment; no ongoing roadmap or maintenance promise.
  form: Issue-backed publishing website
  platforms:
