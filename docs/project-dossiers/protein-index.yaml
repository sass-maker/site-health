product:
  description: Explore dated nutrition records with original label links, observation dates and explicit verification limits.
  publicMakerNote: I wanted a clear catalog for comparing the protein products available in India, despite the difficulty of reliable data.
  purposeContract:
    purpose: Protein Index was built to catalogue and compare protein products available in India using trustworthy nutrition data.
    audience: Indian shoppers comparing packaged protein sources on nutrition, price, and practical fit.
    outcome: Inspect recorded nutrition alongside its source, observation date and verification authority.
    mechanism: A product catalogue normalizes nutrition and comparison fields across available Indian protein products.
    proof: Hosted search and detail expose dated source and authority labels; one original nutrition label and its density calculation were independently checked. This does not verify the entire catalogue.
    nextAction: Historical work only; no active roadmap.
