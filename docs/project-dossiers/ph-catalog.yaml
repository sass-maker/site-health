product:
  description: A resumable local Product Hunt catalogue and analytics experiment with a privacy-safe synthetic demo.
  publicMakerNote: I keep the full catalogue and analytics data local; the public repository demonstrates the real pipeline using original fictional fixtures.
  purposeContract:
    purpose: Build one resumable, deduplicated local product catalogue with explicit provenance and bounded analytical enrichment.
    audience: Developers and product researchers exploring reproducible catalogue and market-analysis workflows.
    outcome: Import, verify, snapshot and explore a local catalogue without publishing third-party product data.
    mechanism: A Python pipeline normalizes public product records into DuckDB and Parquet, while a read-only local UI serves aggregate analytics.
    proof: All 88 tests pass. The three-record fictional offline demo exercises the real parser and database path, produces a verified Zstandard-compressed Parquet snapshot and refuses to overwrite an existing non-sample catalogue.
    nextAction: Finish the bounded experiment, document the repeatable local workflow and then mark the project inactive as a completed experiment.
