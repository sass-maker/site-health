product:
  description: Compare packaged food nutrition and find source-linked vegetarian recipes for Indian kitchens.
  publicMakerNote: I wanted a clear catalog for comparing the protein products available in India, despite the difficulty of reliable data.
  purposeContract:
    purpose: Food helps Indian shoppers compare packaged-food nutrition and discover vegetarian recipes with the original sources visible.
    audience: Indian shoppers and vegetarian cooks comparing foods and practical meal ideas.
    outcome: Find useful foods and recipes while understanding the nutrition basis, source and missing evidence.
    mechanism: One searchable food catalogue combines Open Food Facts product records with a source-linked vegetarian recipe collection.
    proof: Food is being restored from the retained product and recipe sources. Local data staging is available; final shipped-runtime qualification is pending.
    nextAction: Complete recipe consolidation, verify the exact release and qualify food.significanthobbies.com.
