product:
  description: Execution-backed verification for AI-written software changes — local-first and inspectable.
  publicMakerNote: I built CodeVetter to make reviewing AI-generated code rigorous without giving up a local-first workflow.
  purposeContract:
    purpose: CodeVetter verifies whether AI-written software changes actually satisfy their task, not merely whether the diff looks plausible.
    audience: Developers and teams shipping code produced with AI agents.
    outcome: Higher confidence that an agent completed the requested change correctly and safely.
    mechanism: Local-first review combines repository context, executable checks, targeted evaluation, and inspectable verification receipts.
    proof: Published macOS 1.13.9 is signed and notarized. Its CLI has verified real Codex review, passing and failing executable checks, and persisted receipts on a bounded Node fixture.
    nextAction: Try the developer preview on a small local repository. Use the documented manual update path; in-app updating and other review providers remain unqualified.
  form: Desktop app
  platforms:
    - macOS
  prominentTools:
    - Swift
    - SwiftUI
    - Rust
    - SQLite
  retainedGitHistory:
    firstCommitAt: 2025-11-30
    latestCommitAt: 2026-09-18
    retainedCommitCount: 1374
    historyCompleteness: complete
    semantics: firstCommitAt and latestCommitAt are dates from the currently retained Git history. They are not incorporation, launch, or retirement dates.
