product:
  description: A guest resume-tailoring experiment with a reviewable diff and browser-local document exports.
  publicMakerNote: I wanted a focused way to tailor a resume and its supporting material to the actual job description.
  purposeContract:
    purpose: RolePatch tailors a resume and supporting application material to the evidence and language of a specific job.
    audience: A job seeker preparing a serious application for a particular role.
    outcome: Present relevant experience more clearly and prepare for the role without inventing qualifications.
    mechanism: Paste a resume and job description, review the generated changes, save in the browser, and export the current document.
    proof: The guest resume, tailoring, review, save/reload and local document-export path has been verified with synthetic examples. Account sync and broader application tools remain unqualified.
    nextAction: Try the guest workflow for one job, review every proposed claim, and export the version you want to use.
  form: Web app
  platforms:
    - Web
    - API
  prominentTools:
    - Next.js
    - React
    - Cloudflare Workers
    - D1
