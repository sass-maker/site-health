product:
  description: A cost-bounded pipeline for planning, producing, and retaining short-form video artifacts.
  publicMakerNote: I wanted to automate the repetitive work of making and publishing useful product videos.
  purposeContract:
    purpose: Reel Pipeline is a reproducible workflow for turning approved source material into publishable short-form product videos.
    audience: A product operator producing recurring short videos from owned and approved material.
    outcome: Plan, create, review, and retain useful videos without losing cost, provenance, or operator control.
    mechanism: A story-first pipeline records source approval, media-generation steps, artifacts, costs, and publication boundaries.
    proof: The repository contains substantial planning and media automation, but the full publishable loop never shipped and remains held.
    nextAction: Treat the current work as a held pipeline; reopen only by proving one bounded video-to-publication loop with explicit cost limits.
  form: Video pipeline
