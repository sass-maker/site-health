product:
  description: A private field-location system for managed Android devices and team-scoped route review.
  publicMakerNote: "I started Field Track for my father: a lower-cost way for managers to locate employees carrying administrator-enrolled Android devices and review retained routes."
  purposeContract:
    purpose: Field Track is an administrator-managed field-location system for continuously enrolled Android devices and freshness-aware route review.
    audience: A small field team and its manager, initially the owner’s father’s business.
    outcome: Let a manager find employees quickly and review retained routes while managed tracking remains visible on each Android device.
    mechanism: An administrator-enrolled Android app captures points continuously, queues them through weak 4G, and sends them to a team-scoped dashboard where server policy controls retention.
    proof: A clearly labeled synthetic-data dashboard and bounded MVP path exist; economics and physical Android testing remain unresolved.
    nextAction: Review the synthetic demo as a held MVP; validate business economics and a real Android device before expanding or onboarding a team.
  form: Android app and dashboard
  platforms:
    - Android
    - Web
    - API
  prominentTools:
