product:
  description: Earlier resume and hiring workflow superseded by RolePatch.
  publicMakerNote: I explored whether candidates could be ranked more transparently using verified evidence from their public GitHub work.
  purposeContract:
    purpose: TrueHire tested whether technical candidates could be ranked transparently from verified public GitHub evidence.
    audience: Technical candidates and recruiters who wanted inspectable evidence behind a candidate score.
    outcome: Evaluate engineering signals without relying only on self-declared profile claims.
    mechanism: Public GitHub activity was ingested into explicit scoring factors, evidence-linked profiles, and recruiter proof views.
    proof: The evidence-scoring MVP shipped, but trust and marketplace adoption remained unsolved and RolePatch superseded active hiring work.
    nextAction: Read the archived methodology and retained proof only; there is no active marketplace, signup, or standalone roadmap.
