product:
  description: Two playable examples of a local media-editing pipeline, with captions and inspectable source and approval receipts.
  publicMakerNote: I wanted a creator’s archive to become coherent topic-specific compilations instead of a pile of isolated clips.
  purposeContract:
    purpose: Mashup turns an owned creator archive into coherent topic-specific compilations while keeping every edit inspectable.
    audience: A creator or operator assembling comedy, motivation, podcast, or clipping compilations from approved media.
    outcome: Find, approve, sequence, and render useful clips without losing source provenance or editorial control.
    mechanism: A local pipeline combines archive analysis, clipping, editable EDLs, source receipts, approval boundaries, and deterministic rendering.
    proof: The first public Startups proof assembles a source-faithful 47-second argument from four beats across three Creative Commons podcast episodes, with captions and media receipts.
    nextAction: Watch the public examples and inspect their source receipts. The local operator workflow and creator pilot remain separate from this showcase.
  form: Local media tool with public proof
  platforms:
    - Web
    - CLI
    - Local
  prominentTools:
    - Python
    - FFmpeg
    - Astro
    - Cloudflare Pages
