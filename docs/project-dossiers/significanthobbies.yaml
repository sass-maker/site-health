notes:
  catalog: Canonical Hub repository and backend for the five-app Significant Hobbies family. The personal-platform Worker and D1 provide signed-in aggregation, sync, and action contracts; the habits domain remains for historical data compatibility after Anchor absorbed the maintained Habits/Indulge product. Live owns the apex Worker route. Source revisions Hub 3cd97827 and Live b7a47863 keep the public directory at https://significanthobbies.com/ and move the private entry to https://live.significanthobbies.com/hub through the existing Hub binding and Live host-only session. This routing change is locally qualified and not yet deployed. PersonalSyncKit is versioned from this repository for native consumers.
  infrastructure: Worker version dc4e0603-594f-4bf3-a584-459efe46c2e1 is live from exact Git SHA 56bf264b8bcf2aed5230398b34f9250f0de5c14a. D1 personal-platform and both domain service bindings remain active.
