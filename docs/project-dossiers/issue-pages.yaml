  catalog: |-
    Owner-only production pilot at issues.sarthakagrawal.dev, with the workers.dev hostname retained as provider fallback. Worker issue-pages-production and D1 issue-pages are live. Public moderation remains disabled pending an OpenAI key; GitHub rendering needs a read-only token before stranger publishing.
    Owner ended the independent product on 2026-10-09; retained destination: sarthakagrawal-personal. Existing source, data and infrastructure are preserved; no provider decommission or remote repository archival.
    2026-10-09: GitHub repository transferred to sarthakagrawal927 and archived; API readback verified the new owner and archived flag. Existing local checkout, source history and hosted resources retained.
  infrastructure: " 2026-09-26: issue-pages-production Worker deleted with owner approval; D1 retained, custom domain unrouted. Restored same day without cron after owner reversal; secrets need re-adding for GitHub features. 2026-10-05: PR #29 source e3870ad0c0c4f7bc593431a2e3752c7ef99257c5 is live at 100% as version 1b8489d9-f667-43f0-ae3a-30a1c647f5fb; fresh Ahrefs acceptance closed issue #27. See known-closure-runs/issuepages29-release.json."
