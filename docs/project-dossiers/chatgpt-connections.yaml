product:
  description: A read-only MCP gateway that exposes selected public Fleet data to ChatGPT connections.
  publicMakerNote: I had many projects but no solid way to connect them to ChatGPT, so I built a selective gateway for that.
  purposeContract:
    purpose: ChatGPT Connections lets ChatGPT read selected Fleet product data through one bounded gateway.
    audience: The Fleet owner and approved ChatGPT conversations that need specific project context.
    outcome: Ask useful cross-project questions without exposing the private portfolio catalog or granting write access.
    mechanism: A read-only MCP gateway publishes explicit, privacy-filtered resources for named consumers.
    proof: The shared gateway is working and already exposes selected public product contracts to ChatGPT.
    nextAction: Use an existing approved connection; add another resource only when a concrete consumer needs it.
