product:
  description: An OpenAI-compatible free-tier model gateway with operator-provisioned project access.
  publicMakerNote: I built Free AI to make genuinely useful free model capacity easier to discover and use through one resilient interface.
  purposeContract:
    purpose: Free AI makes useful free-tier language-model capacity available through one resilient, OpenAI-compatible interface.
    audience: Fleet applications and developers who need low-cost model access without hard-coding one free provider.
    outcome: Keep AI-dependent workflows available as provider limits, models, and free capacity change.
    mechanism: A capability-aware gateway routes compatible requests across supported free-tier providers with fallback behavior.
    proof: The gateway works for internal consumers and is maintained as shared infrastructure rather than an independent feature product.
    nextAction: Use the compatible gateway from a named consumer; add providers only when they improve capability, reliability, or capacity.
  form: API gateway
  platforms:
    - API
    - Web
  prominentTools:
    - Hono
    - TypeScript
    - Cloudflare Workers
    - D1
