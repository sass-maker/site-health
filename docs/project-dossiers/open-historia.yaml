decision:
  classification: Inactive / merged
  whySummary: Recreate an AI grand-strategy game locally and without credit limits.
  currentState: "Owner merged it into Web Playables on 2026-10-09 as networked-games/open-historia (web-playables#21, PR #22); repository moved to sarthakagrawal927 and checkout to ../fleet-archive/open-historia. The live Worker, D1 and historia.aliveville.com are attributed to Web Playables."
  nextDecision: "Keep: A small local campaign with meaningful decisions and consistent state, inside Web Playables. Stop: An unlimited world simulator, enormous map scope, content breadth and a separate product repository."
