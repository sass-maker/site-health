product:
  description: A private, local-first food, water, and weight journal with transparent timing guidance.
  publicMakerNote: I wanted one personal system for weight loss that connects food logging, fasting, exercise timing, and daily performance.
  purposeContract:
    purpose: Calorie is a private food and body journal that turns lightweight logging into transparent daily and timing guidance.
    audience: A person pursuing weight loss who logs food with one hand and checks progress in short daily moments.
    outcome: Track intake, hydration, weight, and routines quickly, then understand practical training, fasting, and sleep timing.
    mechanism: A local-first iPhone journal records food and four core nutrients, applies visible formulas, and offers optional private sync.
    proof: The maintained app is functionally complete, connected to the Hub family, and designed so recommendations trace to visible rules.
    nextAction: Log a meal or daily measurement in the app; change the product only when repeated use reveals a concrete gap.
