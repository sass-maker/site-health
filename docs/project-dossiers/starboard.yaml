product:
  description: Organize and semantically search your GitHub stars.
  publicMakerNote: GitHub Stars stopped working for me at scale, so I built a better personal interface for exploring what I had saved.
  purposeContract:
    purpose: Starboard makes a large GitHub Stars collection useful for personal exploration and project-aware tool discovery.
    audience: Developers whose saved repositories have outgrown GitHub’s default starred-items interface.
    outcome: Rediscover relevant tools, understand why they were saved, and connect them to current project needs.
    mechanism: Synchronization, search, tags, lists, semantic retrieval, and project-aware recommendations operate over the user’s saved repositories.
    proof: Core sync, search, organization, and project-aware discovery are largely complete and under focused active improvement.
    nextAction: Connect or explore a Stars collection and use a current project question to drive discovery; avoid unrelated alert or reporting scope.
  form: Web app
  platforms:
    - Web
    - API
  prominentTools:
    - Next.js
    - React
    - Cloudflare Workers
    - D1
  retainedGitHistory:
    firstCommitAt: 2026-02-22
    latestCommitAt: 2026-08-30
    retainedCommitCount: 388
    historyCompleteness: complete
    semantics: firstCommitAt and latestCommitAt are dates from the currently retained Git history. They are not incorporation, launch, or retirement dates.
