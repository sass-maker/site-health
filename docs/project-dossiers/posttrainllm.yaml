decision:
  classification: Primary
  whySummary: Explore browser and Mac-local model training, then turn that work into repeatable specialist-model recipes.
  currentState: Active product; ongoing investment within the approved narrow scope.
  nextDecision: "Keep: A reproducible path from private task examples to a measured local-model improvement. Stop: Supporting every model, training method and deployment platform before the core task works."
