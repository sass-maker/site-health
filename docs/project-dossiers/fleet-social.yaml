product:
  description: Private video review, scheduling and delivery tracking for Fleet projects, with local Mashup exports.
  publicMakerNote: I wanted one reviewable social publishing place for Fleet projects.
  purposeContract:
    purpose: Fleet Social is a private social publishing hub for Fleet projects.
    audience: The Fleet owner and internal product feeds.
    outcome: Prepare, approve, schedule, and account for project posts from one place.
    mechanism: Project-attributed drafts pass through owner review before per-account publishing and receipt tracking.
    proof: Private Worker release a5d49a5 is live at 100 percent traffic with green main CI, owner Access sign-in, month/week calendar and saved-revision review. Local Mashup produced a 27.56-second vertical MP4 from two public licensed YouTube originals, with verified receipt hashes and full playback; default source/product examples reuse verified outputs in separate unapproved drafts. Production accepts finished MP4s and excludes the local renderer/rehearsal adapter. The private YouTube canary jhAAHDS1oME was verified on September 26, not rerun in this release.
    nextAction: Complete owner Instagram OAuth and YouTube policy consent/connection readiness, verify machine draft intake and an actual scheduled private upload, then resolve Google OAuth Testing refresh-token expiry.
  form: Private web app
  platforms:
    - Web
    - API
  prominentTools:
    - SvelteKit
    - Cloudflare Workers
    - D1
    - R2
    - Cloudflare Pages
  retainedGitHistory:
