ownerVoice:
  whyVerbatim: "build this out mate — every song is a website: each song gets its own visual world, assembled from curated themes, polished artifacts, and light animation. This is a visual experiment, not a music-streaming app or universal website generator."
  fullReviewVerbatim: |-
    build this out mate — every song is a website: each song gets its own visual world, assembled from curated themes, polished artifacts, and light animation. This is a visual experiment, not a music-streaming app or universal website generator.

    We add more songs and embed the player here. Just pick some famous old songs, some new songs, whatever the most famous ones are. If we can show lyrics, that would be amazing. And a search bar at the error entry point. Add 100 songs at least, do not keep them super distinct unless we have some super easy way. Song quality should be very high and host it on music.significanthobbies.com.
  relatedHistoricalReviews: []
decision:
  classification: Active
  whySummary: Give each famous song its own curated interactive visual world — a playful gallery, not a streaming product.
  currentState: Live at music.significanthobbies.com as a static Workers-assets deploy; 143 songs across five worlds, 32 of them pulled from the owner's Apple Music library with YouTube and Genius embeds.
  nextDecision: Maintain the catalog and worlds; add themes or songs only on explicit request.
