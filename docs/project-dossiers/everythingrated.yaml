ownerVoice:
  whyVerbatim: Everything Rated. This is also a fancy project that I had wanted to build for a long time. The purpose of this product was that you can come, make lists, and rate things. After building it out I realised this is a social product. As of now I didn't really have a lot of energy to build out a social product because it's a big chicken-and-egg problem to solve in those cases. This is something I would re-pick again once I'm more confident in my marketing skills.
  fullReviewVerbatim: Everything Rated. This is also a fancy project that I had wanted to build for a long time. The purpose of this product was that you can come, make lists, and rate things. After building it out I realised this is a social product. As of now I didn't really have a lot of energy to build out a social product because it's a big chicken-and-egg problem to solve in those cases. This is something I would re-pick again once I'm more confident in my marketing skills.
  relatedHistoricalReviews: []
decision:
  classification: Hold
  whySummary: Let people create lists and rate anything.
  currentState: The build exposed a social-network cold-start and moderation problem.
  nextDecision: Reopen only with stronger distribution/marketing ability or a narrow community that solves the chicken-and-egg problem.
