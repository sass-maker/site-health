decision:
  classification: Active
  whySummary: Join six maintained personal applications in one Hub while each retains ownership of its data.
  currentState: Hub UI, backend, typed sync package, and extracted product boundaries are canonical. The historical `habits` domain remains available as compatibility data but is no longer a separate app card.
  nextDecision: Finish unified authentication and complete privacy-safe summaries/actions for the maintained apps without breaking retained domains.
