product:
  description: "A public, read-only data workbench: Nomad Atlas places, High Signal Podcasts claims, Reddit Insights, Research Papers and the full Product Hunt catalogue in one console with ⌘K search, filters, comparison and provenance-carrying exports."
  purposeContract:
    purpose: One public, indexable entry point to browse, search and export the owner's data collections with source provenance; content duplicates the five source sites, which stay live until the owner retires them.
    audience: Anyone browsing these public datasets.
    outcome: Answer questions across the data collections from one console without losing source provenance.
    mechanism: Astro and React islands on one Worker with Hono /api routes and one read-only adapter per collection; every response carries provenance.
    proof: Live at https://data.highsignal.app, with the workers.dev host retained; five collections and source provenance verified in Chrome at 390, 768 and 1440px on 2026-10-15. All 15 sitemap pages return 200 with matching canonicals and no noindex. PH Catalog full export (575,479 products) and DuckDB-WASM binaries remain served from private R2 bucket techdata-data through an exact-key allowlisted Worker route with Range, ETag and public caching.
    nextAction: Use one TechData roadmap for all five retained source components, including High Signal Podcasts. Preserve collection-specific APIs, collectors, provenance and existing sites until any separately scoped migration or retirement.
  form: Public data workbench
  platforms:
    - Web
  prominentTools:
    - Astro
    - React
    - Cloudflare Workers
    - Hono
    - SaaS Maker UI
  retainedGitHistory:
    firstCommitAt: 2026-10-09
    latestCommitAt: 2026-10-15
