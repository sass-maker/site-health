name: PSI Swarm CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/helpers/psi-swarm/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/psi-swarm-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/helpers/psi-swarm/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/psi-swarm-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foundry/helpers/psi-swarm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: foundry/helpers/psi-swarm/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter psi-swarm test
      - run: pnpm run build:cli
      - run: pnpm run build:web
      - run: pnpm run docs:check
      - run: pnpm run docs:build
