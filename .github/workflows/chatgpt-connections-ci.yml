name: ChatGPT Connections CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/helpers/chatgpt-connections/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/chatgpt-connections-ci.yml"
      - ".github/workflows/chatgpt-connections-monitor.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/helpers/chatgpt-connections/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/chatgpt-connections-ci.yml"
      - ".github/workflows/chatgpt-connections-monitor.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: foundry/helpers/chatgpt-connections
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: foundry/helpers/chatgpt-connections/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
