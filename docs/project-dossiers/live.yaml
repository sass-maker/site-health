notes:
  catalog: Independent home for the original Significant Hobbies experience, data, authentication, bookmarks, timelines, and deeper application routes. The existing significanthobbies Worker and D1 remain Live-owned; apex / and /hub proxy to the Hub service binding without migrating user data. The former Turso database is deleted; the empty Turso account is retained for possible future use.
  infrastructure: Worker version ecd54c8c-8df1-4c60-8f52-0942b3b89ced is live at 100% traffic from exact Git SHA 207f11bff5e03207bbe0ffaf79fa446b4629ef72, deployment a10dc6ea-1707-4f3e-9021-4eb98cab8aa9. Live retains its existing data and authentication boundary and proxies only Hub routes to personal-platform. Google callback configuration remains blocked; guest sharing only. The former Turso database was confirmed deleted on 2026-08-30; the empty account is retained.
