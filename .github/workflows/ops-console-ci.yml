name: Ops Console CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/apps/dashboard/fleet-console/**"
      - ".github/workflows/ops-console-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/apps/dashboard/fleet-console/**"
      - ".github/workflows/ops-console-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: foundry/apps/dashboard/fleet-console/package-lock.json
      - working-directory: foundry/apps/dashboard/fleet-console
        run: npm ci
      - working-directory: foundry/apps/dashboard/fleet-console
        run: npm run build
