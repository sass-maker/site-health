product:
  description: A local factory for training, evaluating, and running specialist language models.
  publicMakerNote: I use PostTrainLLM to explore local model training and turn those experiments into repeatable recipes for specialist models.
  purposeContract:
    purpose: PostTrainLLM turns local model-training experiments into measured, reproducible recipes for useful specialist language models.
    audience: Practitioners learning or running post-training workflows on personal Apple hardware and in the browser.
    outcome: Train, evaluate, compare, and run specialist models with evidence about what worked and why.
    mechanism: A local factory joins datasets, training methods, evaluation, experiment tracking, and inference into repeatable recipes.
    proof: The project contains working browser and Mac-local experiments, evaluation infrastructure, and reproducible training paths.
    nextAction: Explore the measured recipes and follow new experiments as they produce reproducible proof rather than scale claims.
  form: Research platform
  platforms:
    - Web
    - Local
  prominentTools:
    - Astro
    - Python
    - Rust
    - Cloudflare Pages
