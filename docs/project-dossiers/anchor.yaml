ownerVoice:
  whyVerbatim: The purpose of anchor was that I was not focusing on one task at a time and when I did focus on one task at a time, I often got distracted by some things. It can be a doorbell. It can be someone calling me. It can be some Slack message. Anything so I wanted to be conscious of those choices.
  fullReviewVerbatim: |-
    The purpose of anchor was that I was not focusing on one task at a time and when I did focus on one task at a time, I often got distracted by some things. It can be a doorbell. It can be someone calling me. It can be some Slack message. Anything so I wanted to be conscious of those choices.

    I think it is ready. I have to start using it.

    What's next for this product? This product will be part of my Significant-Hobbies Hub and I intend to actively use it.
  relatedHistoricalReviews:
    - sourceHeading: Indulge
      whyVerbatim: "Indulge is also quite interesting. I had this idea sitting in, just purely for an iOS application. Imagine an app in which you can select your various indulgences, like TV, adult content, or whatever. You can select multiple and you get a hybrid image of those two things. For example, TV and gaming: you get a TV and a gaming console. You add food and you get popcorn on the side."
      fullReviewVerbatim: |-
        Indulge is also quite interesting. I had this idea sitting in, just purely for an iOS application. Imagine an app in which you can select your various indulgences, like TV, adult content, or whatever. You can select multiple and you get a hybrid image of those two things. For example, TV and gaming: you get a TV and a gaming console. You add food and you get popcorn on the side.

        I had this idea for beautiful onboarding so I was like, let's build it out. It turned out fine. Now I have kind of built it into a habit, because breaking bad habits inherently needs something to replace. It's an idea on that. It is also part of Significant Hobbies Hub so I intend to use and build on it.
      reviewSha256: f6868a96a8397a6aec7316f7883b750fde2c4c469a54fa407643ae36e470b1fd
decision:
  classification: Active
  whySummary: Plan a realistic day, follow it with a focus timer, and explain why the lived day differed.
  currentState: Now the sole maintained successor to Indulge/Habits, including its visual pattern onboarding and non-moralizing replacement framing; the owner simplified the daily loop to direct habit tracking, editable/copyable days, project-linked entries and pause recovery. Native builds are under daily-use qualification; account continuity, the distraction-note privacy contract, and production CloudKit compatibility remain release gates. Current installation receipts belong in the canonical catalog.
  nextDecision: Dogfood the complete schedule → focus → interruption → review loop; use real divergence evidence to decide the next change.
