product:
  description: One-page body experiments with a locally qualified coupled physiology engine, simultaneous mechanisms and explicit yearly/fatal prediction limits.
  publicMakerNote: Change several body mechanisms, Simulate, and inspect matched acute trajectories. Yearly organ aging and fatal causes remain uncalibrated.
  purposeContract:
    purpose: Human V2 helps learners compare simultaneous body changes through coupled, reproducible acute physiology experiments, a visible body and recorded causal observations, with unsupported yearly and fatal outcomes kept explicit.
    audience: Curious learners inspecting reproducible body experiments and their evidence limits.
    outcome: Understand measured coupled responses and distinguish them from unsupported chronic effects or fatal predictions.
    mechanism: One homepage with a visible body, six joint mechanism controls, matched native Pulse4.4.0 short-term experiments, recorded playback and audited threshold observations.
    proof: Exact independent native replay; local finite-output/dense-mean audits, API and browser verification. Custom intervention magnitudes are not independently clinically calibrated; no aging or fatal-cause model.
    nextAction: Choose a body experiment, combine mechanisms and Simulate; inspect the matched acute response and explicit evidence limits.
  form: Browser optimization arena
  platforms:
