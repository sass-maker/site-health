product:
  description: A learning OS for software-engineering interview practice.
  publicMakerNote: I built this as a learning-by-doing system that combines Pomodoro, Feynman, retrieval practice, and practical roadmaps.
  purposeContract:
    purpose: SWE Interview Prep is a personal learning OS that turns software-engineering study into retained, artifact-backed understanding.
    audience: Software engineers preparing for interviews or strengthening practical technical judgment through active study.
    outcome: Build causal understanding that survives recall and can be demonstrated through code, diagrams, explanations, or projects.
    mechanism: An evidence-gated Concept → Drill → Build → Review → Apply loop combines retrieval practice, Feynman explain-backs, roadmaps, and adaptive review.
    proof: A fresh guest can complete a graded TypeScript drill and return to saved code in the same browser. Account sync and AI-graded mastery require sign-in and remain separately unqualified.
    nextAction: Try a coding drill as a guest; progress stays in this browser. Use the issue tracker for account-sync qualification limits.
  form: Learning web app
  platforms:
    - Web
  prominentTools:
    - React
    - Vite
    - TypeScript
    - Cloudflare Pages
