product:
  description: An iOS-native training tracker that runs a written strength, cardio and mobility programme one set at a time and measures each exercise against an authored target.
  publicMakerNote: I built Setline to make workouts easier to execute one set at a time, with timing and performance kept accurate.
  purposeContract:
    purpose: Setline runs a written workout one set at a time and measures each exercise against its authored target.
    audience: A person following a structured strength, cardio, or mobility programme during real sessions.
    outcome: Stay focused on the current set, keep rest timing accurate, and understand performance against the plan.
    mechanism: A native iOS workout player sequences exercises, timers, targets, and completed performance without turning the session into data entry.
    proof: The focused workout loop is under active native development and is being validated through real sessions.
    nextAction: Run an authored workout in Setline and let actual session friction determine the next product change.
