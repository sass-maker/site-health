name: Reel Pipeline CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/services/reel-pipeline/**"
      - "foundry/services/content-factory/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/reel-pipeline-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/services/reel-pipeline/**"
      - "foundry/services/content-factory/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/reel-pipeline-ci.yml"

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foundry/services/reel-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: foundry/services/reel-pipeline/package-lock.json
      - run: npm ci
      - run: node --test
      - run: node scripts/validate-docs.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: foundry/services/reel-pipeline/reel
      - working-directory: foundry/services/reel-pipeline/reel
        run: cargo test --quiet
