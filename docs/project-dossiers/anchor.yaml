product:
  description: A local-first day planner and focus timer for Mac, iPhone, and Apple Watch that explains the gap between the schedule you planned and the day you lived.
  publicMakerNote: I wanted a realistic daily planner that could help me follow the day and explain why the lived plan diverged from the intended one.
  purposeContract:
    purpose: Anchor helps a person plan a realistic day, follow the current intention, and learn why the day lived differed from the day planned.
    audience: A person moving between Mac, iPhone, and Apple Watch who wants a deliberate day rather than another task list.
    outcome: Make more realistic plans, recover from interruptions, and protect activities that genuinely matter without moralizing imperfect adherence.
    mechanism: Native apps combine schedule blocks, recurring routines, wall-clock focus sessions, interruption evidence, and an end-of-day divergence review.
    proof: The maintained successor to Indulge and Habits has signed native builds and an integrated schedule → focus → interruption → review loop under dogfooding.
    nextAction: Use Anchor through a real day and review the divergence evidence; let repeated lived patterns decide the next change.
