product:
  description: A local-first Mac studio for comparing reproducible video-effect variants before export.
  publicMakerNote: I wanted editing intent to choose efficient local video tools before defaulting to expensive generative video.
  purposeContract:
    purpose: Local AI Video Studio helps a creator compare reproducible local video effects before choosing and exporting a result.
    audience: A Mac-based creator who wants deterministic editing options before paying for generative video.
    outcome: Translate an editing intention into visible effect variants and choose a result that can be reproduced.
    mechanism: A native Mac studio uses AVFoundation, Core Image, and hardware video tools to render comparable local variants from one source.
    proof: The bounded local experiment works, but owner interest faded before a recurring creator workflow was established.
    nextAction: Preserved experiment; no current work or obligation to resume.
