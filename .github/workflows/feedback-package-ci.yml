name: Feedback Package CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/packages/feedback/**"
      - ".github/workflows/feedback-package-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/packages/feedback/**"
      - ".github/workflows/feedback-package-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: foundry/packages/feedback
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: foundry/packages/feedback/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
