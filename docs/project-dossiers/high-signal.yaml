notes:
  catalog: "The bounded operator-curated Brief workflow is usable: one source-backed edition passed semantic publication, independent evidence-origin checks, installed MCP reads and live proof navigation. Reliable unattended acquisition remains unverified in issue 133. Navigation responds before data. Production ADMIN_TOKEN rotation and consumer checks passed September 11; the operator review page still requires the exact owner Cloudflare dashboard login to restore its documented Email OTP option. No publication rule was weakened."
  infrastructure: "Both Workers serve 4505493afae6f273560768302d65a06bdcc4962b at 100%. Exact-head CI and Docs passed. ADMIN_TOKEN was rotated through Infisical, GitHub Actions, both Workers and Modal; new token returns 200 and previous token 401. A fresh Modal container authenticated successfully while SEC_USER_AGENT was preserved. Same-token version alignment kept runtime code and existing triggers unchanged. Native /review is separately blocked by Cloudflare Access: the current browser dashboard identity is not the owning account, and the saved owning account requires password login. No Access policy or membership was changed. September 12: both Workers now serve 6185c4db9648b2fbd1d5f8d667a4b0dc46ced355 at 100%. App Health analytics, endpoints and logs have production receipts; declared-bot summaries and history.blocked logs verified. Private ingest key is stored in High Signal Infisical prod and both Workers. A revocable public aggregate analytics link is attached to the footer. The observation baseline includes controlled release-test traffic."
