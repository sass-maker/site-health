name: Fleet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:fleet
      - run: npm run check:registry

  ops-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fleet-ops/apps/ops-console/package-lock.json
      - working-directory: fleet-ops/apps/ops-console
        run: npm ci
      - working-directory: fleet-ops/apps/ops-console
        run: npm run build
