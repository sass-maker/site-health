product:
  description: A local portfolio dashboard for domains, performance, search, and AI visibility evidence.
  publicMakerNote: I built Site Health because I needed one clear view of Fleet’s domains, performance, search visibility, and AI visibility.
  purposeContract:
    purpose: Site Health gives the Fleet owner one private, evidence-backed view of portfolio inventory and public-surface health.
    audience: The owner operating a large portfolio of independent software projects.
    outcome: Know what exists, what is live, and where domains, performance, search, or AI visibility need attention.
    mechanism: A local five-area dashboard joins the canonical catalog with provider, repository, performance, search, and visibility evidence.
    proof: It owns the 56-identity private catalog, generated project dossiers, and the operational evidence used across Fleet reviews.
    nextAction: Run it locally and use its five owner questions to investigate portfolio health; it is not a public SaaS signup.
  form: Local dashboard
