product:
  description: A private iPhone app for the people you actually want to stay close to — closeness-weighted constellation home, standing notes, and a chronological log per person.
  publicMakerNote: I wanted a beautiful personal relationship-memory app that helps me stay more thoughtful about the people in my life.
  purposeContract:
    purpose: Kith helps a person remember the people they genuinely want to stay close to and act with more thoughtfulness.
    audience: An iPhone user who values a small set of relationships and dislikes treating them like a sales CRM.
    outcome: Retain meaningful context, notice who needs attention, and show up better in important relationships.
    mechanism: A private constellation home organizes closeness, standing notes, and a chronological memory log for each person.
    proof: The device-first native product is built around a distinctive constellation model and is in active personal use validation.
    nextAction: Use Kith with real relationships and let recurring memory and follow-through needs guide improvements.
