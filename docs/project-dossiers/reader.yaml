product:
  description: Capture, annotate, revisit, and discuss saved reading.
  publicMakerNote: I wanted any article or PDF to become a focused reading and research surface instead of another forgotten browser tab.
  purposeContract:
    purpose: Reader turns a saved article or PDF into a focused place to read, annotate, revisit, and discuss it.
    audience: People who save serious reading but lose it among browser tabs and undifferentiated bookmarks.
    outcome: Move from capture to attentive reading and retain useful notes and questions around the source.
    mechanism: A dedicated reading surface combines capture, document parsing, annotation, retrieval, and source-grounded discussion.
    proof: The product is mature, but current owner usage is too low to justify speculative expansion.
    nextAction: Use Reader for a real article or PDF; resume improvements only where the capture-to-reading loop actually breaks.
  form: Reading web app
  platforms:
    - Web
    - API
  prominentTools:
    - React
    - Hono
    - Cloudflare Workers
    - D1
  retainedGitHistory:
    firstCommitAt: 2025-11-16
    latestCommitAt: 2026-08-29
    retainedCommitCount: 321
    historyCompleteness: complete
    semantics: firstCommitAt and latestCommitAt are dates from the currently retained Git history. They are not incorporation, launch, or retirement dates.
