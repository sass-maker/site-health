ownerVoice:
  whyVerbatim: Reel pipeline, I don't know. It had the purpose of automating video building and just ensuring the videos were built for each product. They were auto-posted so this product kept spiralling into more and more features but never really got shipped. This is something I would definitely want to break and fix in the future but for now it is on hold.
  fullReviewVerbatim: Reel pipeline, I don't know. It had the purpose of automating video building and just ensuring the videos were built for each product. They were auto-posted so this product kept spiralling into more and more features but never really got shipped. This is something I would definitely want to break and fix in the future but for now it is on hold.
  relatedHistoricalReviews: []
decision:
  classification: Hold
  whySummary: Automate product-video creation and posting.
  currentState: Scope spiralled, accumulated features, and never shipped.
  nextDecision: Before reopening, reduce it to one publishable video loop with explicit cost and operator-time limits.
