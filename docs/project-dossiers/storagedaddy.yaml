product:
  description: A native Mac storage analyzer for developer caches, builds, dependencies and AI session archives, with reviewed cleanup.
  publicMakerNote: I am building a native Mac storage analyzer that makes disk usage clear and cleanup easy to review.
  purposeContract:
    purpose: StorageDaddy helps developers understand and review local storage through a native visual scanner, developer classifications and verified, deliberate cleanup.
    audience: Developers whose Mac builds, dependencies, caches and AI session histories consume storage.
    outcome: Find large storage consumers and review what to archive or move to Trash.
    mechanism: A local SwiftUI and AppKit scanner provides visual exploration, developer insights, reviewed cache cleanup and compact AI conversation exports. Sparkle provides signed macOS update checks.
    proof: Signed and notarized macOS 14+ Apple-silicon beta, measured scans, tested cancellation, verified archive cleanup and restoration, and a publicly downloaded DMG with matching checksum.
    nextAction: Download the free beta at storagedaddy.significanthobbies.com, scan a folder, and review what to archive or move to Trash.
