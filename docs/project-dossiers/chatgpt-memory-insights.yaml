ownerVoice:
  whyVerbatim: I started off this product to have a way to analyse my conversations I have with ChatGPT. Its purpose is that I can use an exported version of ChatGPT's conversation and it will give me insights into memory, what I talk about, my emotions, and other relevant things.
  fullReviewVerbatim: |-
    I started off this product to have a way to analyse my conversations I have with ChatGPT. Its purpose is that I can use an exported version of ChatGPT's conversation and it will give me insights into memory, what I talk about, my emotions, and other relevant things.

    I would say it is at a good stage but I would not call it complete. I think the dashboard and Insights can still use some improvement. In future I would want to include local codecs and cloud agent chats and more cloud services maybe, but add more insights I would say. maybe historical shift
  relatedHistoricalReviews: []
decision:
  classification: Active
  whySummary: Analyse exported AI conversations for themes, memory, emotion, and personal change.
  currentState: Useful but not complete; dashboard and insight quality can improve.
  nextDecision: Deepen historical-shift insights, then add Codex, Claude, and other sources without weakening the browser-local privacy boundary.
