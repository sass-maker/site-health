notes:
  catalog: "Sole maintained successor to Indulge/Habits: a day planner and focus timer for macOS, iOS and watchOS, with direct habit tracking, optional scheduling, day copying and pause/return. Build 24 source 5d1f87a repairs local-history account ownership and keyboard-accessible session start; hosted native review 34268576639 failed Mac authentication cancellation and iPhone metadata navigation. Test-only b75c1c2 fixes visibility handling and passes the focused local iPhone test; Mac cancellation remains unresolved. Last verified installed builds are iPhone 24 and Mac 21; the build 24 launch attempt was blocked by the locked phone. Hub excludes distraction notes, but their private iCloud boundary needs reconciliation with the device-only repo contract. See issue 51 and docs/qualification/hub-ownership-2026-09-09/README.md in Anchor."
  infrastructure: Cloudflare Pages project anchor-landing remains live; the historical habits and indulge Pages projects are attributed here only as compatibility redirects. App Store Connect record 6803853891 has iOS/watchOS build 12 uploaded for processing. The matching Developer ID macOS build 12 is installed and running with Production CloudKit.
