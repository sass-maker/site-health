name: Fleet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: foundry/apps/public-directory/package-lock.json
      - working-directory: foundry/apps/public-directory
        run: npm ci
      - run: npm run test:fleet
      - run: npm run check:registry
      - run: npm run check:public

  feedback-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foundry/packages/feedback
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: foundry/packages/feedback/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  ops-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: foundry/apps/ops-console/package-lock.json
      - working-directory: foundry/apps/ops-console
        run: npm ci
      - working-directory: foundry/apps/ops-console
        run: npm run build
