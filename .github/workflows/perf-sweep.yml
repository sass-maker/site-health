name: Fleet PSI Sweep

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Runs per site'
        required: false
        default: '3'
      concurrency:
        description: 'Concurrent sites'
        required: false
        default: '2'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reusable:
    uses: sass-maker/workflows/.github/workflows/perf-sweep.yml@main
    with:
      runs: ${{ github.event.inputs.runs || '3' }}
      concurrency: ${{ github.event.inputs.concurrency || '2' }}
