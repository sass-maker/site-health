product:
  description: Private agent search over specialized corpora with ranked citations, provenance, and schema-aware retrieval.
  publicMakerNote: I built Knowledge Base as the private, cited retrieval layer that other Fleet applications can rely on.
  purposeContract:
    purpose: Knowledge Base supplies private, cited retrieval over specialized corpora to other Fleet applications and agents.
    audience: Named internal products and agents that need grounded answers from controlled source collections.
    outcome: Retrieve relevant context with ranked citations, provenance, and a schema the consuming product can trust.
    mechanism: A shared RAG service performs corpus-aware search, ranking, citation, and schema-constrained retrieval behind a private boundary.
    proof: The service has healthy Fleet consumers and already operates as the shared cited-retrieval layer.
    nextAction: Connect it only for a concrete consumer need; change the infrastructure when retrieval evidence shows a real failure.
