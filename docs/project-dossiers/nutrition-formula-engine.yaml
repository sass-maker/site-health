product:
  description: A browser-first formulation tool that converts reviewed batch formulas into traceable theoretical composition reports.
  publicMakerNote: I built this to turn mixed-format batch formulas into traceable composition drafts while keeping uncertain ingredient identities visible and correctable.
  purposeContract:
    purpose: Formula Composition Engine converts reviewed manufacturing formulas into theoretical macro, micronutrient, active-moiety, preservative, and missing-evidence reports.
    audience: Food, nutraceutical, supplement, and medicinal-product formulation teams preparing composition work before label and regulatory review.
    outcome: Recover a mixed-format formula, correct ambiguous rows and identities, and export a traceable non-zero composition report.
    mechanism: Browser-local parsing and OCR feed a mandatory review step, then a Decimal-based Worker resolves versioned ingredient profiles, calculates normalized totals, ranges, coverage, and assumptions, and stores explicit saves in one public D1 history shared by every device.
    proof: The public release shows 26 independently published products and all 55 supported ingredient and nutrient comparisons on a separate sourced page; the 15 medicine salt-to-active checks average 0.226% absolute difference with a 0.976% maximum in that subset.
    nextAction: Submit a formula, review every recovered row and identity, and replace public reference assumptions with supplier specifications or lot CoAs before external use.
  form: Formulation analysis web app
  platforms:
    - Web
  prominentTools:
    - Python
    - Cloudflare Workers
    - Cloudflare D1
    - Vite
    - Tesseract.js
