product:
  description: A completed local web and iOS experiment comparing browser-agent strategies with independent verification.
  publicMakerNote: I ran Browser Agent Testing to compare automation by verified feedback time, not by how quickly a driver can finish clicks.
  purposeContract:
    purpose: Browser Agent Testing compares local web and native UI automation with reproducible, product-owned verification.
    audience: Coding agents and maintainers comparing local browser and native UI testing tools.
    outcome: Choose faster and cheaper test strategies without silently losing functional or visual defect detection.
    mechanism: Bounded manifests and receipts run saved or adaptive workflows, then independent product verifiers check UI, persistence, process and visual outcomes.
    proof: The completed experiment publishes a sourced 79-tool catalogue, 26 measured journey arms with 118 verified completions across 129 attempts, seven additional probes, ten retained experiment records, exact observed pins and a live agent-first guide. The measured evidence retains Playwright and Maestro as baselines.
    nextAction: Explore the finished experiment or clone the public repository; replay a documented arm only when a concrete product change justifies it.
  form: Completed benchmark and static guide
  platforms:
    - Web
    - iOS
    - CLI
  prominentTools:
    - Node.js
    - Cloudflare Workers
    - Playwright
    - Maestro
