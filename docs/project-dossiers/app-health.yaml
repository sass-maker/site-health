product:
  description: Privacy-first endpoint health for Node, Go, and OpenTelemetry services.
  publicMakerNote: I built App Health because checking Sentry, PostHog, Slack, and cloud consoles separately made basic product health too fragmented.
  purposeContract:
    purpose: App Health helps product teams understand web traffic, intentional user actions, and application health across their projects.
    audience: Product managers, founders, and product teams; developers connect the instrumentation.
    outcome: See who is active as browser-session counts, which pages and named events are used, and whether backend failures explain product friction.
    mechanism: A small browser tracker and explicit named events feed workspace-scoped analytics; service SDKs and OTLP add aggregate endpoint health in the same dashboard.
    proof: The endpoint-health V0 has a production SDK canary. Google accounts, browser analytics, named-event reports, and workspace presence are implemented and tested locally; production activation and a real Google callback remain unverified.
    nextAction: Explore the illustrative product preview or connect a project in the locally configured workspace; activate and verify Google accounts and analytics before public onboarding.
  form: Monitoring service
  platforms:
    - Web
    - API
  prominentTools:
    - React
    - shadcn/ui
    - Cloudflare Workers
    - D1
