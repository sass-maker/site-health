decision:
  classification: Active
  whySummary: Turn mixed-format food, nutraceutical and medicinal batch formulas into traceable theoretical composition reports before label and regulatory work.
  currentState: Public browser-first workspace accepts pasted text and common files, requires row and identity review, exposes assumptions and per-result contributions, and stores saved formulas and reusable ingredients in one public D1 history shared by every device. The active Worker is tagged to clean pushed `main`.
  nextDecision: Test more supplier-labelled food products, replace public reference assumptions with supplier specifications or lot CoAs, and keep regulatory formatting separate from the underlying calculation.
