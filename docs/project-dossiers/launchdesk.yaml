product:
  description: A local-first launch workspace with a provenance-bearing catalog of 966 submission destinations, per-product queues and source-attributed metrics. Your workspace stays in your browser.
  publicMakerNote: A launch-submission tracker built from attributed public source lists. It keeps reported metrics honest — unknown stays blank, never zero — and stores your queue in your own browser.
  purposeContract:
    purpose: LaunchDesk helps builders choose where to submit a product and track each launch across destinations.
    audience: Indie makers and small teams launching software products.
    outcome: A filtered, queued and tracked set of real submission destinations instead of a stale copy-pasted list.
    mechanism: A deduplicated catalog of 966 prospects with source history, reported DR and link types, per-product queues and statuses; visitor state lives in browser storage, with an optional local Python/SQLite mode for live link checks.
    proof: Public site at launchdesk.significanthobbies.com, 36 passing unit tests, source attribution in data/sources, and explicit unknowns rather than invented metrics.
    nextAction: Open the directory, set your product brief, and queue a small set of fitting destinations.
  form: Web app
  platforms:
