product:
  description: A free personality and hobby quiz that suggests a small experiment to try; account planning is not yet qualified.
  publicMakerNote: I wanted a product that helps people live more intentionally through goals, possibilities, and things worth anticipating.
  purposeContract:
    purpose: Live helps a person turn passive wanting into a life they can deliberately imagine, plan, and experience.
    audience: People who want meaningful goals, possibilities, and experiences to look forward to.
    outcome: Build a personal catalogue of things worth doing and keep moving from possibility toward lived experience.
    mechanism: The independent app combines a bucket list, goals, discovery, search, and suggestions around one private life catalogue.
    proof: The product is independently owned, in active dogfooding, and retains its established data and authentication boundary.
    nextAction: Open Live and use the catalogue, search, and suggestions to add or act on something you genuinely want to experience.
