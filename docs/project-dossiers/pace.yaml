decision:
  classification: Hold
  whySummary: Build a fast, privacy-first local Mac assistant inspired by Hey Clicky.
  currentState: Technically broad and well made, but the owner never formed a usage habit.
  nextDecision: Find one or two moments it should own through daily use before building more capabilities.
