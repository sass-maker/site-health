name: Workflow Policy CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "foundry/ops/scripts/check-github-actions-policy.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "foundry/ops/scripts/check-github-actions-policy.mjs"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable:
    uses: sass-maker/workflows/.github/workflows/workflow-policy-ci.yml@main
