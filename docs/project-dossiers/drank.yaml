  description: Domain Rating intelligence for product, SEO, and market research.
  publicMakerNote: I built DRank when domain-rating data became accessible enough to track the strength of my own domains over time.
  purposeContract:
    purpose: DRank tracks domain-strength evidence for owned products and makes it usable in portfolio decisions.
    audience: The Fleet operator comparing domain authority across products, SEO work, and markets.
    outcome: See current Domain Rating and its changes without manually checking every domain.
    mechanism: A focused adapter collects available domain-rating data and feeds a consistent history into Site Health.
