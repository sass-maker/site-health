product:
  description: A local-first launch workspace with a provenance-bearing catalog of 966 submission destinations, per-product queues and source-attributed metrics. Your workspace stays in your browser.
  publicMakerNote: I built this launch-submission tracker from attributed public source lists. It keeps reported metrics honest — unknown stays blank, never zero — and stores your queue in your own browser.
  purposeContract:
    purpose: Give makers a provenance-honest catalog of launch destinations with per-product submission tracking.
    audience: Builders planning a deliberate launch or backlink campaign.
    outcome: Filter and compare 966 destinations by category, reported DR, link type, price and recorded submission routes.
    mechanism: A static catalog page on the SaaS Maker site renders the attributed dataset with per-row source claims; the local Python/SQLite app adds per-product queues, statuses, notes and a link checker.
    proof: Live catalog at sassmaker.com/launchdesk rendering 966 destinations, 36 passing unit tests, source attribution in data/sources, and explicit unknowns rather than invented metrics.
    nextAction: Open sassmaker.com/launchdesk, filter to a fitting set, and check each row's source history before submitting.
  form: Web app
  platforms:
    - Web
  prominentTools:
    - Astro
    - Cloudflare Pages
    - Python
    - SQLite
  retainedGitHistory:
    firstCommitAt: 2026-09-18
    latestCommitAt: 2026-09-19
