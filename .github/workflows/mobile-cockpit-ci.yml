name: Mobile Cockpit CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/apps/dashboard/mobile-cockpit/**"
      - ".github/workflows/mobile-cockpit-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/apps/dashboard/mobile-cockpit/**"
      - ".github/workflows/mobile-cockpit-ci.yml"
  workflow_dispatch:


concurrency:
  group: mobile-cockpit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable:
    uses: sass-maker/workflows/.github/workflows/mobile-cockpit-ci.yml@main
    with:
      ios-native: ${{ github.event_name == 'workflow_dispatch' }}
