name: Ops Console CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/apps/dashboard/fleet-console/**"
      - ".github/workflows/ops-console-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/apps/dashboard/fleet-console/**"
      - ".github/workflows/ops-console-ci.yml"
  workflow_dispatch:


concurrency:
  group: ops-console-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable:
    uses: sass-maker/workflows/.github/workflows/ops-console-ci.yml@main
