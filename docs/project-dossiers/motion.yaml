decision:
  classification: Hold
  whySummary: Turn body movement captured by a phone into games displayed on a TV.
  currentState: Promising body-as-controller prototype, but physical play quality and distribution remain unproven.
  nextDecision: Reopen for focused physical-device playtesting of one genuinely fun control loop.
