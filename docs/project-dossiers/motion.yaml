product:
  description: Use your body as the controller for an iPhone-hosted game that can mirror to a larger screen.
  publicMakerNote: I wanted body movement captured by a phone to become playful games on a television—and a workout without feeling like one.
  purposeContract:
    purpose: Motion turns body movement seen by an iPhone into the controls for playful games on a larger screen.
    audience: People who want active, social play without buying a dedicated motion-console system.
    outcome: Move, play, and exercise through a game that responds directly to the body.
    mechanism: The iPhone performs body tracking and hosts the game while mirroring the experience to a television or larger display.
    proof: A promising native prototype exists, but physical control feel, fun, and distribution remain unproven on real devices.
    nextAction: Treat it as a held prototype; reopen around physical-device testing of one genuinely fun control loop.
  form: iOS game
