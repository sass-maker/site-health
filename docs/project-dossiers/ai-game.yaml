product:
  description: Persistent AI world and multi-agent simulation experiments.
  publicMakerNote: I wanted to create a long-running world where AI characters remember, form grudges, make choices, and live through open-ended conflict.
  purposeContract:
    purpose: AliveVille explores a playable world where AI characters remember, form relationships and grudges, and act through persistent conflict.
    audience: Players drawn to open-ended agent worlds rather than a demonstration of model APIs.
    outcome: Feel that a small town and its characters remain alive, consequential, and worth returning to.
    mechanism: A persistent simulation combines autonomous NPC memory, quests, dialogue, combat, and a browser-playable 3D town.
    proof: The simulation stack and playable artifact exist, but no visual direction or core loop has yet made the game emotionally compelling.
    nextAction: Preserved experiment; no current work or obligation to resume.
