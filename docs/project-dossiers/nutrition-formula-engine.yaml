notes:
  catalog: Browser-first formula ingestion and theoretical composition prototype for food, nutraceutical, and medicinal product workflows. Supplier specifications, lot CoAs, finished-product assays, and regulatory formatting remain separate requirements.
  infrastructure: "Public browser-first formulation workspace with Static Assets, a Python calculation API, and a migrated D1 database. Cloudflare owns the formula.significanthobbies.com Custom Domain DNS record and TLS certificate. Workers Logs and Traces are enabled. Application-generated logs exclude raw formula and OCR contents; browser sessions can export privacy-safe audit metadata and hashes. Explicit saves store reviewed formulas, immutable reports, decisions, and reusable ingredient profiles in one intentionally public data set shared by every device; IndexedDB is a visibly labelled fallback. The active Worker is tagged to the clean pushed origin/main source commit. 2026-09-26: Cloudflare resources deleted per personal-profile cleanup rule; D1 exports retained in .fleet-local/deleted-backups/. 2026-09-26: Restored. Worker secrets were lost on deletion and must be re-set for auth/AI features."
