product:
  description: Privacy-first endpoint health for Node, Go, and OpenTelemetry services.
  publicMakerNote: I built App Health because checking Sentry, PostHog, Slack, and cloud consoles separately made basic product health too fragmented.
  purposeContract:
    purpose: App Health gives a developer an immediate, privacy-first view of how every observed service endpoint is performing.
    audience: A developer or operator running Node, Go, Hono, Pages Functions, or OpenTelemetry-instrumented services.
    outcome: See endpoint health across short time windows without opening several observability consoles or storing raw request data.
    mechanism: One small SDK or OTLP connection feeds aggregate-only endpoint summaries into a focused private dashboard.
    proof: The production V0 supports multiple Node and Go surfaces, OTLP ingestion, aggregate storage, and live dashboard and ingest hosts.
    nextAction: Integrate a real owned service and use observed failures to guide the next change; the dashboard is not a generic public unlock page.
  form: Monitoring service
  platforms:
    - Web
    - API
  prominentTools:
    - Hono
    - TypeScript
    - Cloudflare Workers
    - D1
