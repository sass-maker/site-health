name: PSI Swarm CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/helpers/psi-swarm/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/psi-swarm-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/helpers/psi-swarm/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/psi-swarm-ci.yml"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable:
    uses: sass-maker/workflows/.github/workflows/psi-swarm-ci.yml@main
