product:
  description: An experimental macOS voice-agent preview; installation and permission-dependent workflows are still being qualified.
  publicMakerNote: I wanted a fast, privacy-first Mac assistant that could understand what is on my screen while keeping the work local.
  purposeContract:
    purpose: HeyPace is a private Mac assistant for fast voice-driven help grounded in what is currently on screen.
    audience: A Mac user who wants contextual assistance without sending their desktop workflow to a hosted service.
    outcome: Get useful help in the moment with less typing and less context switching.
    mechanism: A local macOS agent combines voice interaction, screen context, and device-side tools.
    proof: The public 0.3.19 preview is downloadable and the native implementation includes voice, screen context, local planning, and macOS actions; signed-release hardware smoke and sustained daily use remain unproven.
    nextAction: Download the current Mac preview, test one recurring voice-and-screen workflow, and judge it against Pace's visible local and off-device trust boundary.
  form: macOS app
  platforms:
    - macOS
    - Web
  prominentTools:
    - Swift
    - SwiftUI
    - Astro
    - Cloudflare Pages
