name: Fleet Contracts CI

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "foundry/ops/automation/**"
      - "foundry/ops/config/**"
      - "foundry/ops/host/**"
      - "foundry/ops/lib/**"
      - "foundry/ops/scripts/**"
      - "foundry/ops/templates/**"
      - "foundry/ops/test/**"
      - "foundry/ops/workflows"
      - "foundry/apps/public-directory/**"
      - ".gitmodules"
      - ".github/workflows/fleet-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "foundry/ops/automation/**"
      - "foundry/ops/config/**"
      - "foundry/ops/host/**"
      - "foundry/ops/lib/**"
      - "foundry/ops/scripts/**"
      - "foundry/ops/templates/**"
      - "foundry/ops/test/**"
      - "foundry/ops/workflows"
      - "foundry/apps/public-directory/**"
      - ".gitmodules"
      - ".github/workflows/fleet-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize public workflow module
        run: git submodule update --init --depth 1 foundry/ops/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: foundry/apps/public-directory/package-lock.json
      - working-directory: foundry/apps/public-directory
        run: npm ci
      - run: npm run test:fleet
      - run: npm run check:registry
      - run: npm run check:public
