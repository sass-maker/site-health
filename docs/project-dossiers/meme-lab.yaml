product:
  description: A public tool that ranks 3,000 reaction memes for a comment; its Anna review candidate also creates personal photo memes with private saves and PNG downloads.
  publicMakerNote: I built Meme Lab to test whether a model can pick the right reaction meme for a comment, with a public playground for feedback.
  purposeContract:
    purpose: Turn one pasted comment or situation into a useful meme immediately.
    audience: People selecting reactions for everyday conversations; the owner evaluates selection quality.
    outcome: Return the best meme first, with four scored alternatives across distinct perspectives when available.
    mechanism: A corrected 3,000-reference catalogue uses dual-view BGE embeddings and Vectorize to retrieve 30 candidates, then Jev rates tone, social fit, and distinct perspectives. GIF results load their full animated asset while the searchable collection uses lightweight still previews. The Anna review candidate uses the same shortlist with Anna-hosted contextual ranking and private saved reactions; it shares stable reference links without submitted situations. Anna version 1.2.0 adds user-supplied static templates and identity photos, one host image request, paired review, private generated-output storage and host PNG downloads.
    proof: Custom domain and retained workers.dev route verified live on Worker version fa5fa091-6db6-42cb-a644-ebac8c721ff6 at 100% traffic from main commit a86faa861d54e13c1065b98c2094a0776bff7ebf. Health reports 3,000 catalogue records, the public collection reports 1,195 GIFs and zero artwork fillers or excluded editing canvases, Vectorize reports 6,000 vectors, and the live sitemap exposes 3,003 canonical URLs. IndexNow accepted all 31 sitemap batches with zero failures, and Google Search Console accepted the sitemap on 2026-09-22. The pending-review 100-case gate reached 67% retrieval-at-30, 60% top-three relevance, 90% top-three given retrieval, and 96% correct serious-content abstention.
    nextAction: Try comments on the public playground and label misses. Anna personalized edition 1.2.0 is hosted-verified and awaiting Store review.
  form: Local experiment, Worker playground and Anna review candidate
  platforms:
    - Web
    - Local
  prominentTools:
    - Cloudflare Workers
    - Workers AI
    - Vectorize
    - D1
    - Anna SDK
  retainedGitHistory:
    firstCommitAt: 2026-09-20
    latestCommitAt: 2026-10-09
