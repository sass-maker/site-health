product:
  description: Search vegetarian recipes by protein and calories, with links to the original recipe publishers.
  publicMakerNote: I wanted a practical collection of higher-protein recipes that works with ingredients people actually use in Indian kitchens.
  purposeContract:
    purpose: Recipe Index collects practical higher-protein vegetarian foods and recipes built around ingredients used in Indian kitchens.
    audience: Vegetarian cooks in India who want more protein without abandoning familiar ingredients and meals.
    outcome: Find realistic food ideas and compare their nutrition when meal variety becomes useful.
    mechanism: A searchable food directory organizes recipes and ingredient-level protein comparisons for an Indian cooking context.
    proof: A public directory exists, but the result did not become compelling enough to justify active expansion.
    nextAction: Historical work only; no active roadmap.
