product:
  description: A local-first Mac workplace where named AI employees have bounded responsibilities and their work stays inspectable.
  publicMakerNote: I wanted to explore a company where humans and non-coding agents each own outcomes and keep working toward them over time.
  purposeContract:
    purpose: Office OS gives a small-organization owner a persistent Mac workplace for hiring, directing, and supervising named AI employees.
    audience: An owner who wants useful non-technical AI employees without managing prompts, workflows, or agent infrastructure directly.
    outcome: Delegate bounded responsibilities, see progress and blockers, review artifacts, intervene safely, and resume work across days.
    mechanism: Named employees have durable roles, memory, workspaces, skills, scoped authority, and inspectable outcome loops inside a local organization folder.
    proof: A credible local proof of concept can run a bounded writer-manager workday, but differentiation and recurring owner use remain unproven.
    nextAction: Preserved experiment; no current work or obligation to resume.
  form: macOS app
  platforms:
    - macOS
    - Local
  prominentTools:
    - SwiftUI
    - SpriteKit
    - Codex CLI
