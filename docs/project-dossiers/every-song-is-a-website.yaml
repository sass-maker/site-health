product:
  description: A playful static site where each of 143 songs gets its own interactive visual world — old desktop, picnic blanket, acid poster, neon night, or scrapbook page — with embedded video and licensed lyrics.
  publicMakerNote: "Built as a visual experiment: a composition system of themes, artifacts, and behaviours where each song becomes a tiny interactive world."
  purposeContract:
    purpose: Every Song Is a Website gives each song a curated visual world — a shareable URL with embedded video, licensed lyrics, and playful interactions.
    audience: Anyone who loves music and the web.
    outcome: Browse 143 songs as interactive themed worlds.
    mechanism: Static registry + theme skins (desktop, picnic, kinetic) + seeded layouts; YouTube and Genius embeds supply media and lyrics.
    proof: Live at music.significanthobbies.com with verified official video embeds, in-page play, expandable windows, and Genius lyric cards on all 143 songs across five worlds.
