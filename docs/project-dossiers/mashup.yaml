notes:
  catalog: |-
    Independent, maintained local-first editorial product for archive analysis, inspectable planning, approval, provenance, and multi-clip rendering. Its Cloudflare Pages surface at mashup.highsignal.app screens approved proof media only; uploads, archive storage, rendering, approvals, and publishing remain local. Reel Pipeline accepts only its finished-media receipt and has no runtime dependency.
    Owner ended the independent product on 2026-10-09; merged into Fleet Social (sass-maker/fleet-social PR #14, squash 2ad5d4c; issue fleet-social#13) as tools/mashup. Cloudflare Pages project mashup and mashup.highsignal.app stay live (direct upload), attributed to fleet-social as steward; future deploys come from tools/mashup/web.
    2026-10-09: GitHub repository transferred to sarthakagrawal927 (not GitHub-archived); local checkout moved intact to ../fleet-archive/mashup.
  infrastructure: "2026-10-09: merged into Fleet Social; Pages project mashup and mashup.highsignal.app are attributed to fleet-social (infrastructure.projects.fleet-social, transferredFrom mashup)."
