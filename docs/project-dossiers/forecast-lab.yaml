product:
  description: Forecasting experiments and evaluation tooling.
  publicMakerNote: I wanted to learn forecasting by modeling how regional, temporal, and behavioral signals shape commerce demand.
  purposeContract:
    purpose: Forecast Lab is an evaluation-first learning environment for modeling how regional, temporal, and behavioral signals shape commerce demand.
    audience: A practitioner learning forecasting methods with bounded datasets and explicit evaluation.
    outcome: Understand which signals improve a forecast and where the model fails, without pretending to offer a proven consulting product.
    mechanism: Rust, Python, and web experiments compare forecasting approaches against held-out data and visible metrics.
    proof: The research toolkit supports concrete experiments, but lacks the proprietary data and domain validation required for credible B2B claims.
    nextAction: Preserved experiment; no current work or obligation to resume.
