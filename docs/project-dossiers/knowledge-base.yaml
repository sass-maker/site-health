notes:
  catalog: "'Private Agent Search' — public landing at knowledgebase.sassmaker.com, app/search surface at search.sassmaker.com, plus fleet shared RAG service (Vectorize/D1/R2). Pages deployment is Git-connected to sass-maker/knowledge-base."
  infrastructure: "The knowledgebase-app Worker is the retained legacy OpenNext app deployment; the current app surface is the Cloudflare Pages project with the same name. On 2026-08-30 the RAG Worker moved all indexed corpora to Workers AI embeddings, removed its Free AI gateway binding and direct-provider runtime configuration, and retained the old 1536-dimensional Vectorize index only as unreferenced rollback data. 2026-09-26: the retained legacy knowledgebase-app Worker and the unreferenced rag-bge-768, rag-bge-small-384, and rag-voyage-1024 Vectorize indexes were deleted with owner approval."
