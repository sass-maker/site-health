name: AI Visibility Helper CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/helpers/ai-visibility/**"
      - ".github/workflows/ai-visibility-package-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/helpers/ai-visibility/**"
      - ".github/workflows/ai-visibility-package-ci.yml"
  workflow_dispatch:


concurrency:
  group: ai-visibility-package-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable:
    uses: sass-maker/workflows/.github/workflows/ai-visibility-package-ci.yml@main
