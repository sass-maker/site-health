product:
  description: A public personal tool that ranks 3,000 reaction memes for a pasted comment and returns the best match plus scored alternatives.
  publicMakerNote: I built Meme Lab to test whether a model can pick the right reaction meme for a comment, with a public playground for feedback.
  purposeContract:
    purpose: Rank reaction memes against a pasted comment and evaluate local-model selection honestly.
    audience: The owner; the public playground is a bounded demo surface.
    outcome: Return the best meme first, with four scored alternatives across distinct perspectives when available.
    mechanism: A corrected 3,000-reference catalogue uses dual-view BGE embeddings and Vectorize to retrieve 30 candidates, then Jev rates tone, social fit, and distinct perspectives. GIF results load their full animated asset while the searchable collection uses lightweight still previews.
    proof: Custom domain and retained workers.dev route verified live on Worker version 873a5fa3 at 100% traffic from main commit 8a33c3b. Health reports 3,000 catalogue records, the public collection reports 1,195 GIFs and zero artwork fillers or excluded editing canvases, and Vectorize reports 6,000 vectors. The pending-review 100-case gate reached 67% retrieval-at-30, 60% top-three relevance, 90% top-three given retrieval, and 96% correct serious-content abstention.
    nextAction: Try comments at memes.significanthobbies.com, label the returned options, and use misses to improve retrieval before the separate 30,000-item movie-dialogue corpus.
  form: Local experiment and Worker playground
  platforms:
    - Web
    - Local
  prominentTools:
    - Cloudflare Workers
    - Workers AI
    - Vectorize
    - D1
    - Node.js
