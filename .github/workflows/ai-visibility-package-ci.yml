name: AI Visibility Helper CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/helpers/ai-visibility/**"
      - ".github/workflows/ai-visibility-package-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/helpers/ai-visibility/**"
      - ".github/workflows/ai-visibility-package-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: foundry/helpers/ai-visibility
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: foundry/helpers/ai-visibility/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
