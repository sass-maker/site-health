product:
  description: Series home and a local read-only MCP source preview for performance, storage, browser rules and agent context.
  publicMakerNote: I moved the daddy series onto its own domain so the apps read as one family.
  purposeContract:
    purpose: DaddyRad is the umbrella home for the daddy series of native macOS utilities.
    audience: Mac users and developers discovering the daddy-series apps.
    outcome: One domain introduces all four apps and routes to each product's site.
    mechanism: A small Cloudflare Worker serves the series landing; each app owns its subdomain. A local stdio MCP source preview uses all four native cores with bounded read-only tools.
    proof: DaddyRad MCP mcp-v0.1.0 source preview published 2026-10-02 at https://github.com/Significant-Hobbies/daddyrad/releases/tag/mcp-v0.1.0. Exact-revision CI verifies all eight tools across four engines. Source/build instructions only; no signed/notarized server executable is distributed.
    nextAction: Merged into ios-landings (site) and chatgpt-memory-insights (MCP); no independent roadmap.
