product:
  description: A ratings experiment for comparing AI developer tools, with visible small-sample counts and shareable weighting.
  publicMakerNote: I have long wanted a place where people can make lists and rate anything, while recognizing that its social loop needs real care.
  purposeContract:
    purpose: EverythingRated makes anonymous opinions about AI developer tools visible axis by axis.
    audience: Developers and technical operators comparing AI development tools for real projects.
    outcome: Inspect trade-offs across Speed, Accuracy, Cost, Ergonomics and Integration depth, with the sample size visible.
    mechanism: A public directory combines per-axis rating counts with weighted comparison links; unrated axes remain visibly unavailable.
    proof: The hosted guest comparison covers a 24-tool directory with five axes. Initial owner ratings and small samples are early opinions, not benchmarks or consensus.
    nextAction: Historical work only; no active roadmap.
  form: Ratings experiment
