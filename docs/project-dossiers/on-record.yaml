notes:
  catalog: |-
    High Signal sub-product (own layout). Live at podcasts.highsignal.app; API at api.podcasts.highsignal.app. Workers on-record-api and high-signal-podcasts. D1 on-record-db, R2 on-record-raw. Source https://github.com/Significant-Hobbies/on-record.
    2026-10-22: Owner consolidated the remaining High Signal Podcasts Fleet identity into TechData. TechData already serves Podcast claims, episodes and people through its read adapter; live stats matched the source API during this review. Retain the on-record repository, checkout, ingestion, API, website and data as source components under the TechData roadmap. No source move, redirect, deployment or provider retirement was performed.
  infrastructure: API-only deployment34348609233 released 46badc63151dd30a7bd95914763cf493a653023c after exact CI34348449974 and six deployment gates passed. Worker version 6ac7d86c-e48f-4dad-986b-c3c5455afc27 / deployment eb87f76e-e2fc-4269-a644-2b3c2f204736 verified at 100% on 2026-09-09. Web unchanged; no migration. Twelve paired stats responses preserved all counts. Issue24 remains open for production D1 row-read evidence; source and live receipts are in on-record/docs/operations/stats-performance-2026-09-09.md. Repository icon release 3e63f77c0fc0a5215063f75bf723d000aad17ee4 verified on existing high-signal-podcasts deployment 5fd158b1-b07f-4f1b-b061-08b1ab4f36a6. Exact source CI and six release gates passed; rendered guest browser homepage checks passed at 390px and 1440px.
