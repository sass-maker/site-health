product:
  description: A private Gmail workspace for local semantic search, sender insights, and explicit unsubscribe workflows.
  publicMakerNote: Gmail did not help me see who was filling my inbox, so I built a clearer way to understand volume and unsubscribe.
  purposeContract:
    purpose: Kinetic helps a person understand who fills their Gmail inbox and deliberately reduce unwanted volume.
    audience: A Gmail user who wants private search, sender-level insight, and explicit unsubscribe control.
    outcome: Find old mail, identify repeat senders, and unsubscribe with a clear understanding of what will change.
    mechanism: A private Gmail workspace combines local semantic search, sender aggregation, and user-confirmed unsubscribe workflows.
    proof: The maintained application performs its intended search, sender-insight, and unsubscribe jobs in regular use.
    nextAction: Open the private workspace and investigate a sender or search question; no speculative feature expansion is planned.
