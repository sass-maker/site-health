product:
  description: A native Mac workspace for coding-agent skills, context, usage and telemetry, with a unified skill library, explicit local changes, and recovery history.
  publicMakerNote: ContextDaddy is supposed to handle all things AI agents locally (context, skills, usage, otel etc) to help debug/speed up
  purposeContract:
    purpose: Help developers inspect coding-agent context, skill exposure, usage, and available local telemetry.
    audience: Developers using multiple coding agents on a Mac.
    outcome: Find actionable context and usage problems with evidence and explicit measurement limits.
    mechanism: A native Mac app combines bounded discovery, previewed local skill management with recovery, offline usage history, and local OpenTelemetry views.
    proof: Public 0.2.1 build 10 verified at https://context.daddyrad.com/download and GitHub release v0.2.1-10. SHA-256 e43afdb396041f0abb6bdbcad718eb74c09745612574124adb49088331e36940 matches the Developer ID signed, Apple notarized DMG from protected release run 36259190197, source b04f3c423341a8ec421933835569c3019c3355ba. Installed to /Applications/ContextDaddy.app and launched; Gatekeeper accepted the notarized app. Guided Skills onboarding, bounded scrolling including legacy scrollbars, and Devin in unified Local History. Manual updates only. Discovery does not prove live prompt use. Installed Skills library populated; rescan and guided selection passed. Discovery retains explicit entry/depth coverage limits.
    nextAction: Download the signed 0.2.1 beta; open Skills and follow Guide. Updates are manual downloads.
  form: macOS app
  platforms:
    - macOS
    - Web
  prominentTools:
    - SwiftUI
    - Astro
    - Cloudflare Workers
