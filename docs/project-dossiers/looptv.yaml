product:
  description: A lean-back, TV-style random video player for curated channels.
  publicMakerNote: I wanted a more controlled and curated way to watch YouTube, shaped like television rather than an endless feed.
  purposeContract:
    purpose: LoopTV turns curated YouTube channels into a calmer, lean-back television experience.
    audience: Viewers who want intentional channel selection without YouTube’s endless recommendation feed.
    outcome: Start watching something suitable quickly while retaining control over the available catalogue.
    mechanism: A TV-like random player uses curated channels, focused search, and resilient handling of unavailable videos.
    proof: The maintained product is complete for its intended viewing loop and already handles common catalogue failures.
    nextAction: Open a curated channel and watch; future changes are limited to catalogue health or a proven viewing need.
  form: Web app
  platforms:
    - Web
    - TV
  prominentTools:
    - Astro
    - React
    - Vite
    - Cloudflare Pages
