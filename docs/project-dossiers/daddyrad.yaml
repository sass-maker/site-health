notes:
  catalog: |-
    DaddyRad is the public umbrella for four native Mac apps. Its Worker serves daddyrad.com and redirects www; each app owns its public subdomain, download, and update path.
    Owner ended the independent project on 2026-10-09. The site merged into ios-landings sites/daddyrad (Significant-Hobbies/ios-landings PR #43, squash ab3e1d9; issue ios-landings#42) and was deployed from ios-landings main ab3e1d9 as Worker daddyrad version 7b4aebf3-ff56-4d12-9ed1-83d3ac8742f8 (previous 09722320-7fb7-4468-b72b-2327430285de); live routes, headers, www 301, 404, HEAD and 405 byte/header-identical before and after. mcp/ and its macOS CI moved to chatgpt-memory-insights (https://github.com/Significant-Hobbies/chatgpt-memory-insights/pull/60 (25c4940)).
    2026-10-09: GitHub repository transferred to sarthakagrawal927 (not GitHub-archived); local checkout moved intact to ../fleet-archive/daddyrad.
  infrastructure: "2026-10-09: merged into ios-landings; Worker daddyrad, daddyrad.com, www.daddyrad.com and the daddyrad.com email routing are attributed to ios-landings (infrastructure.projects.ios-landings, transferredFrom daddyrad)."
