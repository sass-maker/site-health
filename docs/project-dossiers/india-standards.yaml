product:
  description: A transparent India demographic standards calculator using aggregate PLFS data, explicit uncertainty ranges, and clear source limits.
  publicMakerNote: I wanted official data to provide a more grounded answer to how a person is doing in the Indian context.
  purposeContract:
    purpose: India Standards contextualizes a person’s situation against official Indian demographic data without pretending the comparison is exact.
    audience: People who want a grounded India-specific reference for demographic and economic comparison.
    outcome: Understand where a value sits in aggregate context and see the uncertainty and source limits behind that estimate.
    mechanism: A transparent calculator uses aggregate PLFS data, explicit ranges, documented formulas, and visible caveats.
    proof: The working calculator exposes its aggregate sources and uncertainty, while current data quality limits further expansion.
    nextAction: Historical work only; no active roadmap.
  form: Reference web app
