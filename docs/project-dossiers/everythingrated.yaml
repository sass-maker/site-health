product:
  description: Multi-axis ratings for deciding which AI developer tools to adopt.
  publicMakerNote: I have long wanted a place where people can make lists and rate anything, while recognizing that its social loop needs real care.
  purposeContract:
    purpose: EverythingRated helps developers decide which AI development library to adopt by making the important trade-offs visible axis by axis.
    audience: Developers and technical operators comparing AI development tools for real projects.
    outcome: Choose an AI library with a clearer view of maintenance, community, license, API stability, footprint, and model portability.
    mechanism: Anonymous multi-axis ratings, weighted comparisons, confidence counts, and moderated tool submissions focus one directory on adoption decisions.
    proof: The live surface compares 24 AI development libraries; the broader rate-anything concept and other seeded directories are deliberately parked.
    nextAction: Compare AI development tools or rate one yourself; broader directory expansion waits for adoption traffic or moderation evidence.
  form: Ratings experiment
  platforms:
    - Web
  prominentTools:
    - Astro
    - Next.js
    - Cloudflare Workers
    - D1
  retainedGitHistory:
    firstCommitAt: 2026-04-26
    latestCommitAt: 2026-08-29
    retainedCommitCount: 162
    historyCompleteness: complete
    semantics: firstCommitAt and latestCommitAt are dates from the currently retained Git history. They are not incorporation, launch, or retirement dates.
