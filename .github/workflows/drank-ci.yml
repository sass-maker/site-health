name: Drank CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/helpers/drank/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/drank-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/helpers/drank/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/drank-ci.yml"
  workflow_dispatch:


concurrency:
  group: drank-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable:
    uses: sass-maker/workflows/.github/workflows/drank-ci.yml@main
