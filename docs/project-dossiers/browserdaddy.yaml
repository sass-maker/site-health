product:
  description: A local-first Mac browsing intelligence app for a unified history archive and real attention tracking.
  publicMakerNote: I am building a local-first Mac browsing intelligence app that turns browser history and attention into an inspectable archive.
  purposeContract:
    purpose: BrowserDaddy helps people understand their browsing history and attention locally across browsers.
    audience: Mac users who want a unified, inspectable record of browsing and attention.
    outcome: Review browsing history and attention without sending the archive to a hosted service.
    mechanism: A native local Mac app extracts browser archives, watches focus and classifies topics only after explicit opt-in.
    proof: Native 0.3.1 build4 is signed, notarized and installed locally; the public Sparkle feed matches it. The GitHub release is private and the public landing does not link a first-install DMG.
    nextAction: Read the public landing; an existing installation can use the live update feed. First-install distribution remains private.
