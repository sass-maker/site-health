product:
  description: "Software as a specialized service: a living studio of focused products built for particular problems and maintained in public."
  publicMakerNote: I use SaaS Maker as the public home for Fleet and as a workshop for reusable feedback, workflow, and automation tools.
  purposeContract:
    purpose: SaaS Maker is the public product studio and reusable tooling workshop for the Fleet portfolio.
    audience: Visitors exploring Sarthak’s products and builders consuming the studio’s public packages, workflows, and evidence.
    outcome: Understand the body of work and reuse the tools that have earned a stable place across its products.
    mechanism: A generated public directory sits beside shared feedback, UI, workflow, skill, and automation tooling maintained through real Fleet use.
    proof: It publishes the canonical privacy-safe project directory and houses packages and tooling used by multiple independent repositories.
    nextAction: Explore the complete directory or open the public tooling catalogue; product-specific work continues in each owning repository.
  form: Web directory and service
