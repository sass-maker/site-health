name: Reel Pipeline CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/marketing/reel-pipeline/**"
      - "foundry/marketing/content-factory/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/reel-pipeline-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "foundry/marketing/reel-pipeline/**"
      - "foundry/marketing/content-factory/**"
      - "foundry/ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/reel-pipeline-ci.yml"
  workflow_dispatch:


concurrency:
  group: reel-pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable:
    uses: sass-maker/workflows/.github/workflows/reel-pipeline-ci.yml@main
