product:
  description: Interactive historical storytelling and world simulation.
  publicMakerNote: I wanted a local, credit-free version of an AI grand-strategy game where long-form memory could make countries feel alive.
  purposeContract:
    purpose: Open Historia explores a local AI grand-strategy game where countries remember history and carry it into future turns.
    audience: Strategy players interested in emergent historical storytelling without metered model credits.
    outcome: Play a coherent campaign in which countries feel persistent and past decisions continue to matter.
    mechanism: A local simulation combines long-form country memory, generated events, diplomacy, and an interactive campaign map.
    proof: Durable country memory works as an idea, but the map and campaign-turn loop were not enjoyable enough to sustain development.
    nextAction: Treat it as a held game; reopen only with a game-quality map and one coherent, enjoyable campaign turn.
