product:
  description: Small browser-playable game experiments.
  publicMakerNote: I built this laboratory to understand how idle and HTML-based games are designed, shipped, and distributed.
  purposeContract:
    purpose: Web Playables is a small laboratory for learning how browser and YouTube-ready games are designed, packaged, and distributed.
    audience: A builder studying reusable HTML5 game mechanics and portable distribution constraints.
    outcome: Prototype a mechanic once and ship it as a normal web game and a submission-ready playable package.
    mechanism: A reusable gamekit supplies loops, saves, offline progress, platform adapters, and builds for a small games hub.
    proof: The research goal produced a working gamekit, a live idle game, and YouTube-compatible packaging; the project is now parked.
    nextAction: Preserved experiment; no current work or obligation to resume.
  form: Game collection
