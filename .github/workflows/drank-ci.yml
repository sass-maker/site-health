name: Drank CI

on:
  push:
    branches: [main]
    paths:
      - "services/drank/**"
      - "fleet-ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/drank-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/drank/**"
      - "fleet-ops/scripts/manual-component-deploy.mjs"
      - ".github/workflows/drank-ci.yml"

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/drank
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: services/drank/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run size

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            services/drank/pnpm-lock.yaml
            services/drank/docs-site/pnpm-lock.yaml
      - working-directory: services/drank
        run: python3 scripts/check_docs_links.py
      - working-directory: services/drank/docs-site
        run: pnpm install --frozen-lockfile
      - working-directory: services/drank/docs-site
        run: pnpm run build
