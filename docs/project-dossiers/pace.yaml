ownerVoice:
  whyVerbatim: Pace. It started off as a fork of a product called Hey Clicky. I also wanted to build a personal assistant. I copied most features. I added some features of my own. I wanted to make it a local-first product. I think it's pretty well made also. I tried training my own model. It has a lot of features, it has a lot of abilities, but I've never really used it myself. I don't know why. I don't really have a solid answer why I did not use it but since I did not use it, it kept falling in priority. I would definitely want to work on this more in the future.
  fullReviewVerbatim: Pace. It started off as a fork of a product called Hey Clicky. I also wanted to build a personal assistant. I copied most features. I added some features of my own. I wanted to make it a local-first product. I think it's pretty well made also. I tried training my own model. It has a lot of features, it has a lot of abilities, but I've never really used it myself. I don't know why. I don't really have a solid answer why I did not use it but since I did not use it, it kept falling in priority. I would definitely want to work on this more in the future.
