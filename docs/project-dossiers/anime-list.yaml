product:
  description: Anime and manga discovery with multi-axis filtering and personal watchlists.
  publicMakerNote: I wanted better anime filtering and discovery than the standard catalog experience, with a watchlist that works for me.
  purposeContract:
    purpose: Anime List helps anime and manga fans filter a large catalogue, discover what fits, and maintain a personal watchlist.
    audience: Anime and manga fans who want more precise discovery than a standard catalogue provides.
    outcome: Find suitable titles quickly and keep personal viewing or reading plans organized.
    mechanism: Multi-field search, shareable filters, seasonal discovery, taste tools, schedules, and signed-in watchlists operate over a large synced catalogue.
    proof: The production app serves roughly 35,000 titles and is frequently used; broader community features are intentionally out of scope.
    nextAction: Search the catalogue or use the watchlist; maintenance focuses on data quality and core discovery reliability.
  form: Web app
  platforms:
    - Web
    - API
  prominentTools:
    - React
    - Vite
    - Hono
    - Cloudflare
