product:
  description: Search evidenced podcast claims and follow links back to the original episode or publication.
  publicMakerNote: I’m building High Signal Podcasts to extract useful insights, recommendations, and emerging technology signals from top podcasts without listening to every episode.
  purposeContract:
    purpose: High Signal Podcasts indexes evidenced claims, recommendations, books, and tools mentioned by notable podcast guests.
    audience: People who want useful ideas from important podcasts without listening to every episode end to end.
    outcome: Find what a person actually said or recommended and trace it back to the source episode.
    mechanism: A source-backed corpus extracts attributable claims and organizes them into people, topics, books, tools, and emerging signals.
    proof: The public corpus is live with 11,624 published claims, 294 named references, and 1,190 episodes with evidence.
    nextAction: Explore the finished experiment; no ongoing roadmap or maintenance promise.
  form: Podcast intelligence web app
  platforms:
