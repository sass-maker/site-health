notes:
  catalog: |-
    Owner decision 2026-10-09 (Significant-Hobbies/ph-catalog#14): consolidated data workbench named techdata, private repo High-Signal-App/techdata, first real product on the SaaS Maker UI library. Collectors stay in their repos; techdata only reads until parity. The five source projects (Reddit Insights, Research Papers, High Signal Podcasts, Nomad Atlas, PH Catalog) stay active until the owner retires them. Chosen domain: data.highsignal.app. Open: fate of the five public sites and where collectors live.
    2026-10-17: The owner requested one active Fleet identity for Nomad, PH Catalog, Research Papers and Reddit Insights: TechData. Their historical project rows, source repositories, local paths, collectors and live sites remain retained source components. High Signal Podcasts stays active as its distinct API/ingestion service. This membership change is not a source-site retirement or full operator-workflow parity claim.
    2026-10-17 local cleanup: Removed the four remote-backed source checkouts after verifying the bundled Nomad bytes and public/R2 adapter paths. Local-only data/evidence are retained in the private TechData source-components store; PH linked worktrees keep their Git metadata outside Fleet. Collectors and live source services remain source-owned.
    2026-10-22: Owner added High Signal Podcasts to the same consolidated Fleet identity. All five collections now share the TechData roadmap. Podcast ingestion, published API, retained website and repository remain source components; this membership change does not assert complete source-workflow parity or retire services.
  infrastructure: Canonical public Worker at https://data.highsignal.app; workers.dev retained. Five source sites remain independent pending techdata#13. Previous Worker version remains in Cloudflare deployment history for rollback.
