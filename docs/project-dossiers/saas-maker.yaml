product:
  description: A public directory of working experiments, launch destinations, reference projects and reusable tooling.
  publicMakerNote: I use SaaS Maker as the public home for Fleet and as a workshop for launch research, reusable feedback, workflow, and automation tools.
  purposeContract:
    purpose: SaaS Maker is the public product studio and reusable tooling workshop for the Fleet portfolio.
    audience: Visitors exploring Sarthak’s products and builders consuming the studio’s public packages, workflows, and evidence.
    outcome: Understand the body of work, research source-attributed launch destinations, and reuse the tools that have earned a stable place across its products.
    mechanism: A generated public directory and native launch-destination catalog sit beside shared feedback, UI, workflow, skill, and automation tooling maintained through real Fleet use.
    proof: It publishes the canonical privacy-safe project directory, serves the provenance-bearing /launchdesk catalog, and houses packages and tooling used by multiple independent repositories.
    nextAction: Explore the complete directory or open the public tooling catalogue; product-specific work continues in each owning repository.
  form: Web directory and service
  platforms:
    - Web
    - API
  prominentTools:
    - Astro
    - Cloudflare
    - D1
    - IssuePages
