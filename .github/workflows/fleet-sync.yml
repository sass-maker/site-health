name: Fleet Sync Guard

on:
  push:
    branches: [main]
    paths:
      - 'foundry/ops/config/spotlight-products.json'
      - 'foundry/ops/config/spotlight-sync.json'
      - 'foundry/ops/scripts/sync-spotlight-products.mjs'
      - 'foundry/ops/scripts/validate-spotlight-products.mjs'
      - '.github/workflows/fleet-sync.yml'
  pull_request:
    paths:
      - 'foundry/ops/config/spotlight-products.json'
      - 'foundry/ops/config/spotlight-sync.json'
      - 'foundry/ops/scripts/sync-spotlight-products.mjs'
      - 'foundry/ops/scripts/validate-spotlight-products.mjs'
      - '.github/workflows/fleet-sync.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:


concurrency:
  group: fleet-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable:
    uses: sass-maker/workflows/.github/workflows/fleet-sync.yml@main
