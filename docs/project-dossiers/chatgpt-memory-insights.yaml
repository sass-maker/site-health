product:
  description: A browser-local experiment for importing a ChatGPT export, exploring semantic themes and search, and optionally saving analysis on your device.
  publicMakerNote: I wanted to learn what my exported AI conversations reveal about my themes, emotions, memory, and personal change.
  purposeContract:
    purpose: Memory Map turns an exported AI conversation history into a private map of recurring themes, facts, emotions, and change.
    audience: People curious about patterns across their own ChatGPT history who do not want to upload the archive to a service.
    outcome: Recognize recurring concerns and how interests, language, and personal themes changed over time.
    mechanism: The browser computes structured conversation analysis locally from an imported export and presents linked historical views.
    proof: A useful browser-local dashboard exists today; deeper shift analysis and additional export sources remain active work.
    nextAction: Import a ChatGPT export locally and explore the resulting private map; the source archive stays in the browser.
  form: Web app
  platforms:
    - Web
  prominentTools:
    - Astro
    - TypeScript
    - Cloudflare Pages
  retainedGitHistory:
    firstCommitAt: 2026-02-26
    latestCommitAt: 2026-10-09
    retainedCommitCount: 1507
    historyCompleteness: complete
    semantics: firstCommitAt and latestCommitAt are dates from the currently retained Git history. They are not incorporation, launch, or retirement dates.
