    purpose: Significant Hobbies is the shared home and privacy-aware control plane for five independently owned personal applications.
    audience: One person using Live, Calorie, Setline, Kith, and Anchor as a connected personal system.
    outcome: See and act across the five apps without collapsing their data ownership or product identities.
    mechanism: A Hub, backend, and typed sync contracts exchange privacy-safe summaries and semantic actions while each app keeps its own source and data.
    proof: The canonical Hub lists five maintained apps. Journal is removed from the product lineup; Journal and Habits source/data compatibility history remains retained. Private cross-app use still needs hosted qualification.
