product:
  description: An experimental public GitHub analysis tool for repository activity, contributions and code churn.
  publicMakerNote: I built GitStat to understand how my time and code churn are distributed across a large collection of repositories.
  purposeContract:
    purpose: GitStat explains how engineering effort, contribution history, and code churn are distributed across many repositories.
    audience: A developer managing enough GitHub projects that the normal contribution graph no longer answers useful questions.
    outcome: See where time and change are going and distinguish sustained work from noisy activity.
    mechanism: A GitHub analytics dashboard aggregates commits, churn, collaboration, and AI-assisted work across the portfolio.
    proof: The maintained dashboard answers the owner’s recurring repository-distribution questions and is considered functionally complete.
    nextAction: Use the dashboard for a concrete portfolio question; request new analysis only when an unanswered recurring question appears.
  form: Web app
  platforms:
    - Web
  prominentTools:
    - React
    - Vite
    - TypeScript
    - Cloudflare Pages
  retainedGitHistory:
    firstCommitAt: 2026-08-21
