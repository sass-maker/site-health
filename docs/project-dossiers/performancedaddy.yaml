product:
  description: A local Mac performance investigator for background apps, helpers and developer workloads, with measured evidence and reviewed actions.
  publicMakerNote: I am building a local Mac performance investigator that makes process, port and slowdown evidence easier to review.
  purposeContract:
    purpose: PerformanceDaddy helps developers inspect local processes, ports and measured slowdown signals before taking action.
    audience: Developers running local servers, coding agents and other moving parts on a Mac.
    outcome: Find the process or port evidence behind a slowdown and choose the next check deliberately.
    mechanism: A native local Mac app records bounded CPU, memory, thermal, process and socket observations with reviewed stop controls.
    proof: Private native macOS repository and local preview surface; no public download or guaranteed root-cause diagnosis is claimed.
    nextAction: Read the public PerformanceDaddy landing and release status; no native download is available.
  form: macOS app
  platforms:
    - macOS
    - Web
  prominentTools:
