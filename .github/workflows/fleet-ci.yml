name: Fleet Contracts CI

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "foundry/ops/automation/**"
      - "foundry/ops/config/**"
      - "foundry/ops/host/**"
      - "foundry/ops/lib/**"
      - "foundry/ops/scripts/**"
      - "foundry/ops/templates/**"
      - "foundry/ops/test/**"
      - "foundry/ops/workflows"
      - ".gitmodules"
      - ".github/workflows/fleet-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "foundry/ops/automation/**"
      - "foundry/ops/config/**"
      - "foundry/ops/host/**"
      - "foundry/ops/lib/**"
      - "foundry/ops/scripts/**"
      - "foundry/ops/templates/**"
      - "foundry/ops/test/**"
      - "foundry/ops/workflows"
      - ".gitmodules"
      - ".github/workflows/fleet-ci.yml"
  workflow_dispatch:


concurrency:
  group: fleet-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable:
    uses: sass-maker/workflows/.github/workflows/fleet-ci.yml@main

  code-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: foundry/ops/pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install quality tooling
        working-directory: foundry/ops
        run: |
          pnpm install --frozen-lockfile
          pip install lizard==1.23.0 pycycle==0.0.8 ruff==0.16.2 vulture==2.16
      - name: Run Fleet Ops code-health gates
        env:
          CODE_HEALTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        working-directory: foundry/ops
        run: pnpm run check
