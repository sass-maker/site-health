product:
  description: The shared Hub and backend for six maintained Significant Hobbies applications, plus retained compatibility data domains.
  publicMakerNote: I wanted one Hub for my maintained personal apps while letting every app keep ownership of its own data.
  purposeContract:
    purpose: Significant Hobbies is the shared home and privacy-aware control plane for six independently owned personal applications.
    audience: One person using Live, Journal, Calorie, Setline, Kith, and Anchor as a connected personal system.
    outcome: See and act across the six apps without collapsing their data ownership or product identities.
    mechanism: A Hub, backend, and typed sync contracts exchange privacy-safe summaries and semantic actions while each app keeps its own source and data.
    proof: The canonical Hub supports exactly six maintained apps; the former Habits domain remains compatibility data, not a seventh product.
    nextAction: Open the Hub to reach the six apps; current work focuses on unified authentication and safe cross-app summaries.
