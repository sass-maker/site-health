product:
  description: A creator-owned public profile that answers visitor questions and preserves context for better inbound.
  publicMakerNote: "I wanted a link-in-bio surface that could grow into something more personal: a greeting card, profile, and small agent."
  purposeContract:
    purpose: Karte gives a creator or independent operator a public profile that answers visitor questions and preserves context for better inbound.
    audience: An individual or small company that wants visitors to understand and explore who they are through one compact page.
    outcome: Help a visitor find relevant links, context, and answers instead of scanning an undifferentiated list.
    mechanism: A designed profile combines greeting-card presentation, owner-published context, structured links, visitor questions, contact handoff, and a small grounded agent.
    proof: The individual profile and conversational foundation are strong; company positioning and repeated company use remain the next validation.
    nextAction: Explore the existing profile experience; company adoption should wait for a focused workflow and a real company test.
  form: Web app
  platforms:
    - Web
    - API
  prominentTools:
    - Next.js
    - React
    - Cloudflare Workers
    - D1
