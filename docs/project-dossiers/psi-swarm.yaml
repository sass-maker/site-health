product:
  description: Source-installed local Lighthouse audits with saved history; use the documented source setup, not the older packaged release.
  publicMakerNote: I wanted repeatable evidence of how my products perform under real Lighthouse conditions, not a single flattering test.
  purposeContract:
    purpose: PSI Swarm measures website performance as repeated distributions instead of a single flattering Lighthouse run.
    audience: The Fleet operator and developers who need trustworthy performance evidence across public products.
    outcome: See typical performance, variability, and regressions under repeated real measurement conditions.
    mechanism: An operational CLI runs and aggregates multiple PageSpeed and Lighthouse observations for Site Health.
    proof: The completed measurement tool already feeds repeated performance evidence into the portfolio dashboard.
    nextAction: Run it for a concrete performance investigation or consume its evidence in Site Health; keep the tool operationally narrow.
  form: Local performance tool
  platforms:
    - Web
    - CLI
  prominentTools:
    - TypeScript
    - Lighthouse
    - SQLite
    - Astro
