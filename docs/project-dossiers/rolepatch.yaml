product:
  description: Evidence-bound resume tailoring and review-first application preparation for one specific job.
  publicMakerNote: I wanted a focused way to tailor a resume and its supporting material to the actual job description.
  purposeContract:
    purpose: RolePatch tailors a resume and supporting application material to the evidence and language of a specific job.
    audience: A job seeker preparing a serious application for a particular role.
    outcome: Present relevant experience more clearly and prepare for the role without inventing qualifications.
    mechanism: The product joins job-description analysis, resume tailoring, role research, proof review, and interview preparation in one workflow.
    proof: A strong working product exists, including the evidence ideas retained from TrueHire, but owner job-search intent is currently absent.
    nextAction: Use it against a real application when job hunting resumes; until then, treat the product as held rather than actively marketed.
  form: Web app
  platforms:
    - Web
    - API
  prominentTools:
    - Next.js
    - React
    - Cloudflare Workers
    - D1
